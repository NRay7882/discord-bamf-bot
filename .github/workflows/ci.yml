name: CI

# Validate every change before it can be merged. Runs on pull requests into the
# long-lived branches and on the pushes that land there. On a public repo this
# runs on GitHub-hosted runners with unlimited free minutes.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# One in-flight run per branch/PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Module contract tests
        run: npm test

      - name: Docs are up to date
        run: npm run docs:check
